[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pbsbench"
version = "0.1.0"
description = "Core PBS-VL model, training pipeline, and PBSBench data utilities"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "PBSBench authors"}]
dependencies = [
  "accelerate>=0.30",
  "fairscale>=0.4.13",
  "iopath>=0.1.10",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "omegaconf>=2.3",
  "pandas>=2.0",
  "Pillow>=10",
  "PyYAML>=6",
  "safetensors>=0.4",
  "timm>=1.0",
  "torch>=2.2",
  "torchvision>=0.17",
  "tqdm>=4.66",
  "transformers>=4.49,<5",
]
[project.optional-dependencies]
qwen = ["bitsandbytes>=0.43"]
preprocessing = ["opencv-python-headless>=4.8", "openslide-python>=1.3", "tensorflow>=2.15"]
evaluation = ["sentence-transformers>=3.0"]
[project.scripts]
pbsbench-train = "pbsbench.training.cli:train_main"
pbsbench-infer = "pbsbench.training.cli:infer_main"
pbsbench-evaluate = "pbsbench.evaluation.cli:evaluate_main"
pbsbench-extract-features = "pbsbench.preprocessing.features:extract_features_main"
pbsbench-tile = "pbsbench.preprocessing.cli:tile_main"
pbsbench-crop-cells = "pbsbench.preprocessing.cli:crop_main"
pbsbench-prepare-data = "pbsbench.preprocessing.prepare:prepare_main"
[tool.setuptools.packages.find]
include = ["pbsbench*"]
[tool.setuptools]
license-files = [
  "LICENSE",
  "THIRD_PARTY.md",
  "pbsbench/models/blip2/LICENSE.txt",
]
[tool.setuptools.package-data]
"pbsbench.models.blip2" = ["configs/models/blip2/*.yaml", "LICENSE.txt"]
[tool.ruff]
line-length = 100
target-version = "py310"
